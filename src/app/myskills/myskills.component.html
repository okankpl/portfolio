<div class="container">
  <section aria-labelledby="skills-heading">
    <div class="skills-container">
      <h2 id="skills-heading">{{ 'MY_SKILLS.SKILLS' | translate }}</h2>
      <div class="my-skills">
        @for (skill of skills; track skill.name) {
          <div>
            <img [src]="'./assets/img/' + skill.icon" alt="" width="64" height="64" loading="lazy" decoding="async" />
            <span>{{ skill.name }}</span>
          </div>
        }
      </div>
      <div class="backend-skills">
        <p>{{ 'MY_SKILLS.BACKEND' | translate }}</p>
        <ul>
          @for (skill of backendSkills; track skill) { <li>{{ skill }}</li> }
        </ul>
      </div>
    </div>
  </section>
</div>
